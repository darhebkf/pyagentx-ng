# net-snmp agent used by the interop suite. Loopback only.
agentaddress udp:127.0.0.1:11161

rocommunity public 127.0.0.1
rwcommunity private 127.0.0.1

# AgentX master, so a snmpkit subagent can register a subtree.
master agentx
agentXSocket /var/agentx/master
agentXPerms 0777 0777 root root

# USM users covering the auth/priv combinations snmpkit implements.
createUser authOnlyUser    SHA  "authonlypass123"
createUser authPrivAesUser SHA  "authprivpass123" AES "privpass123456"
createUser authPrivDesUser MD5  "md5despass123"   DES "despass123456"
createUser sha256User      SHA-256 "sha256pass123" AES "privpass123456"

rouser authOnlyUser    auth
rouser authPrivAesUser priv
rouser authPrivDesUser priv
rouser sha256User      priv

sysLocation "snmpkit interop container"
sysContact  "interop@example.invalid"
