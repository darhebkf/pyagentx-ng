[project]
name = "snmpkit"
version = "1.9.0"
description = "High-performance SNMP toolkit for Python, powered by Rust"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["uvloop>=0.21"]
keywords = ["snmp", "agentx", "network", "monitoring", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://snmpkit.dev"
Documentation = "https://snmpkit.dev"
Repository = "https://github.com/darhebkf/snmpkit"
Changelog = "https://github.com/darhebkf/snmpkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/darhebkf/snmpkit/issues"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "snmpkit.core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]

[tool.pdm.scripts]
dev = "maturin develop"
refresh = {composite = ["refresh:rust", "refresh:python", "refresh:docs"]}
"refresh:rust" = "maturin develop"
"refresh:python" = "pdm sync -G dev"
"refresh:docs" = {shell = "cd docs && bun install"}
test = "pytest -n auto {args}"
lint = "ruff check {args:.}"
fmt = {shell = "ruff check --fix . && ruff format ."}
fmt-check = {shell = "ruff check . && ruff format --check ."}
bench = "python -m benchmarks.run_all"
lock = "pdm lock --update-reuse"
outdated = "pdm outdated"
[dependency-groups]
dev = [
    "maturin>=1.8,<2.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
]

# Benchmark comparison targets. Out of dev because they pull in jinja2, lark
# and requests; PDM treats every group as a dev group, so install with -G bench.
bench = [
    "pysnmp>=7.1.22",
    "pysmi>=2.0",
]
